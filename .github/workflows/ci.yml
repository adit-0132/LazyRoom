name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      LAZYROOM_HOME: ${{ github.workspace }}/.pm-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gmic tesseract-ocr libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: G'MIC CLI (Windows, best effort — G'MIC tests skip if unavailable)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://gmic.eu/files/windows/gmic_3.7.6_cli_win64.zip -OutFile gmic.zip
          Expand-Archive gmic.zip -DestinationPath gmic
          $exe = Get-ChildItem gmic -Recurse -Filter gmic.exe | Select-Object -First 1
          "LAZYROOM_GMIC=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install
        run: python -m pip install -e ".[all,dev]"
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  package:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[all]" pyinstaller
      - name: Icons
        run: python packaging/make_icons.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2 libegl1 libgl1 libxkbcommon0 libfontconfig1
          PYTHON=python packaging/linux/build_appimage.sh
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 ./dist/LazyRoom-*-x86_64.AppImage --json info > /dev/null
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:PYTHON = "python"
          .\packaging\windows\build_windows.ps1
          .\dist\LazyRoom\lazyroom.exe --json info | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: lazyroom-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.zip
            dist/*setup.exe
